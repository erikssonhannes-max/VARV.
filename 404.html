<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'self'">
<meta name="robots" content="noindex">
<title>Sidan finns inte | VARV.</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/varv-32.png">
<style>
:root{--bg:#fff;--tile:#f4f4f6;--ink:#111114;--muted:#6e6e76;--link:#e0123f;--accent:#f0124a;--accent2:#ff6a3d;--hot:linear-gradient(135deg,var(--accent),var(--accent2));
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--tile:#141416;--ink:#f5f5f7;--muted:#9a9aa3;--link:#ff4d6d;--accent:#ff2d55;--accent2:#ff7a45;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f);letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none}
.brand img{width:30px;height:30px;border-radius:8px}
.eyebrow{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h1{font-size:clamp(34px,9vw,51px);letter-spacing:-.045em;line-height:1.04;margin:6px 0 10px;font-weight:600}
p{color:var(--muted);margin:0 0 24px;max-width:52ch}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:980px;text-decoration:none;font-weight:600}
.links a.hot{background:var(--hot);color:#fff}
.links a.ghost{background:var(--tile);color:var(--ink)}
</style>
</head>
<body><div class="wrap">
<div class="top"><a class="brand" href="/"><img src="/icons/varv-192.png" alt="">VARV.</a></div>
<span class="eyebrow">404</span>
<h1>Sidan finns inte.</h1>
<p>Länken kan vara gammal eller felstavad. Gå till startsidan eller titta på kommande tävlingar.</p>
<div class="links"><a class="hot" href="/">Till startsidan</a><a class="ghost" href="/tavlingar/">Tävlingar</a></div>
</div></body></html>
